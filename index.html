<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugam Digital Services</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f4f4f4;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-right:5px;
}

.save{
    background:#2e7d32;
    color:white;
}

.delete{
    background:#d32f2f;
    color:white;
}

h1{
    text-align:center;
}

.service-title{
    font-size:20px;
    font-weight:bold;
}

.service-gu{
    color:#555;
    margin-bottom:10px;
}

ul{
    padding-left:20px;
}

.search-box{
    position:sticky;
    top:0;
    background:#f4f4f4;
    padding-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Sugam Digital Services</h1>

<div class="search-box">
<input type="text" id="search" placeholder="Search Gujarati or English...">
</div>

<div class="card">
<h3>Add New Service</h3>

<input id="serviceEn" placeholder="Service Name (English)">
<input id="serviceGu" placeholder="Service Name (Gujarati)">

<textarea id="documents"
placeholder="Documents (one per line)

Aadhaar Card
Ration Card
PAN Card"></textarea>

<button class="save" onclick="addService()">Save Service</button>
</div>

<div id="results"></div>

</div>

<script>

let services =
JSON.parse(localStorage.getItem("services")) || [

{
serviceEn:"Income Certificate",
serviceGu:"આવકનો દાખલો",
documents:[
"Aadhaar Card",
"Ration Card",
"PAN Card",
"Salary Slip"
]
},

{
serviceEn:"EWS Certificate",
serviceGu:"EWS પ્રમાણપત્ર",
documents:[
"Aadhaar Card",
"Ration Card",
"Income Certificate",
"PAN Card"
]
}

];

function saveData(){
localStorage.setItem(
"services",
JSON.stringify(services)
);
}

function renderServices(filter=""){

const results=document.getElementById("results");

results.innerHTML="";

services
.filter(service=>{

const search=filter.toLowerCase();

return service.serviceEn.toLowerCase().includes(search)
||
service.serviceGu.includes(filter);

})

.forEach((service,index)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="service-title">
${service.serviceEn}
</div>

<div class="service-gu">
${service.serviceGu}
</div>

<b>Required Documents:</b>

<ul>
${service.documents.map(doc=>`<li>${doc}</li>`).join("")}
</ul>

<button class="delete"
onclick="deleteService(${index})">
Delete
</button>

`;

results.appendChild(card);

});

}

function addService(){

const en=document.getElementById("serviceEn").value.trim();

const gu=document.getElementById("serviceGu").value.trim();

const docs=document
.getElementById("documents")
.value
.split("\n")
.filter(x=>x.trim()!="");

if(!en || !gu){
alert("Enter both English and Gujarati names");
return;
}

services.push({
serviceEn:en,
serviceGu:gu,
documents:docs
});

saveData();

document.getElementById("serviceEn").value="";
document.getElementById("serviceGu").value="";
document.getElementById("documents").value="";

renderServices();

}

function deleteService(index){

if(confirm("Delete this service?")){

services.splice(index,1);

saveData();

renderServices();

}

}

document
.getElementById("search")
.addEventListener("input",e=>{

renderServices(e.target.value);

});

renderServices();

</script>

</body>
</html>
