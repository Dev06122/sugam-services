<style>

    border:1px solid #ccc;
    border-radius:10px;

    color:#888;
    margin-top:30px;

</head>

"Mobile Number"
]

];

function renderServices(filter=""){

const results=document.getElementById("results");

const filtered=services.filter(service=>{

return service.serviceEn.toLowerCase().includes(filter.toLowerCase())
||
service.serviceGu.includes(filter);

});

if(filtered.length===0){

results.innerHTML=
'<div class="no-result">No Service Found</div>';

return;
}

results.innerHTML="";

filtered.forEach(service=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`
<div class="service-title">${service.serviceEn}</div>
<div class="service-gu">${service.serviceGu}</div>

<b>Required Documents:</b>

<ul>
${service.documents.map(doc=>`<li>${doc}</li>`).join("")}
</ul>
`;

results.appendChild(card);

});

}

document
.getElementById("search")
.addEventListener("input",function(e){

renderServices(e.target.value);

});

renderServices();

</script>
